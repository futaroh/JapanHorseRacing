<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini JSON チャット</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; margin-bottom: 4px; }
    h1 span { font-size: 14px; font-weight: normal; color: #888; }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h3 { margin: 0 0 10px; font-size: 14px; color: #555; }

    #jsonPreview {
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
      font-family: monospace;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre;
    }

    #status {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    #status.idle    { background: #e8f0fe; color: #1967d2; }
    #status.loading { background: #fff8e1; color: #f57f17; }
    #status.ready   { background: #e6f4ea; color: #188038; }
    #status.error   { background: #fce8e6; color: #c62828; }

    input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }

    #chatLog {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      min-height: 200px;
      max-height: 450px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }
    .chat-empty {
      color: #aaa;
      font-style: italic;
      text-align: center;
      margin: auto;
    }
    .message-wrap { display: flex; flex-direction: column; }
    .message-wrap.user   { align-items: flex-end; }
    .message-wrap.gemini { align-items: flex-start; }
    .sender { font-size: 11px; font-weight: bold; margin-bottom: 3px; opacity: 0.6; }
    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user    { background: #4285f4; color: white; border-bottom-right-radius: 4px; }
    .bubble.gemini  { background: #f1f3f4; color: #333;  border-bottom-left-radius: 4px; }
    .bubble.loading { background: #f1f3f4; color: #888;  border-bottom-left-radius: 4px; font-style: italic; }
    .bubble.error   { background: #fce8e6; color: #c62828; border-bottom-left-radius: 4px; }

    .input-row { display: flex; gap: 8px; }
    .input-row textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      height: 60px;
      box-sizing: border-box;
    }
    .input-row textarea:disabled { background: #f5f5f5; }
    .input-row button {
      background: #4285f4;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    .input-row button:hover    { background: #3367d6; }
    .input-row button:disabled { background: #aaa; cursor: not-allowed; }

    .hint { font-size: 12px; color: #999; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>Gemini JSON チャット <span>— sample.json に関する質問</span></h1>

  <div class="card">
    <label for="apiKey">Gemini API キー</label>
    <input type="password" id="apiKey" placeholder="AIza..." />
  </div>

  <div class="card">
    <h3>読み込み済みファイル：<code>sample.json</code></h3>
    <div id="jsonPreview">（読み込み中...）</div>
  </div>

  <div id="status" class="idle">⏳ sample.json を読み込み中...</div>

  <div id="chatLog">
    <span class="chat-empty">質問を入力してください</span>
  </div>

  <div class="input-row">
    <textarea id="userInput" placeholder="sample.json の内容について質問してください... (Ctrl+Enter で送信)" disabled
              onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="askGemini()" disabled>送信</button>
  </div>
  <p class="hint">Ctrl+Enter でも送信できます</p>

  <script>
    let loadedJsonText = "";

    // ページ読み込み時に sample.json を自動取得
    window.addEventListener("DOMContentLoaded", async () => {
      const preview = document.getElementById("jsonPreview");
      try {
        const res = await fetch("sample.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        loadedJsonText = text;
        try {
          preview.textContent = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
          preview.textContent = text;
        }
        setStatus("ready", "✅ sample.json を読み込みました。質問を入力してください。");
        document.getElementById("userInput").disabled = false;
        document.getElementById("sendBtn").disabled = false;
      } catch (err) {
        preview.textContent = `⚠ sample.json の読み込みに失敗しました: ${err.message}`;
        setStatus("error", "❌ sample.json が見つかりません");
      }
    });

    // 質問のたびに JSON + 質問をまとめて送信
    async function askGemini() {
      const prompt = document.getElementById("userInput").value.trim();
      const apiKey = document.getElementById("apiKey").value.trim();
      const sendBtn = document.getElementById("sendBtn");

      if (!apiKey) { alert("APIキーを入力してください。"); return; }
      if (!prompt) return;
      if (!loadedJsonText) { alert("sample.json がまだ読み込まれていません。"); return; }

      appendMessage("user", "あなた", prompt);
      document.getElementById("userInput").value = "";
      sendBtn.disabled = true;

      const loadingBubble = appendMessage("loading", "Gemini", "思考中...");

      const combinedText = `【参照資料: sample.json】\n${loadedJsonText}\n\n【質問】\n${prompt}`;

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: {
                parts: [{ text: "あなたは提供された資料に基づいてのみ回答するアシスタントです。資料に記載のない情報については「資料に記載がありません」と答え、推測で答えないでください。" }]
              },
              contents: [{
                parts: [{ text: combinedText }]
              }]
            })
          }
        );

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);

        const reply = data.candidates[0].content.parts[0].text;
        loadingBubble.className = "bubble gemini";
        loadingBubble.innerText = reply;

      } catch (err) {
        loadingBubble.className = "bubble error";
        loadingBubble.innerText = "エラー: " + err.message;
      } finally {
        sendBtn.disabled = false;
        scrollToBottom();
      }
    }

    function appendMessage(type, sender, text) {
      const log = document.getElementById("chatLog");
      const empty = log.querySelector(".chat-empty");
      if (empty) empty.remove();

      const wrap = document.createElement("div");
      wrap.className = `message-wrap ${type === "user" ? "user" : "gemini"}`;

      const senderEl = document.createElement("div");
      senderEl.className = "sender";
      senderEl.innerText = sender;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${type}`;
      bubble.innerText = text;

      wrap.appendChild(senderEl);
      wrap.appendChild(bubble);
      log.appendChild(wrap);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom() {
      const log = document.getElementById("chatLog");
      log.scrollTop = log.scrollHeight;
    }

    function setStatus(type, text) {
      const el = document.getElementById("status");
      el.className = type;
      el.textContent = text;
    }

    function handleKey(e) {
      if (e.key === "Enter" && e.ctrlKey) {
        e.preventDefault();
        askGemini();
      }
    }
  </script>
</body>
</html>
