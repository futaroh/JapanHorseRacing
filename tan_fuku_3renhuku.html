<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめての競馬｜馬券の種類をわかりやすく解説</title>
  <link rel="icon" href="favicon-uma180.png">
  <style>
    body {
      font-family: "Rounded Mplus 1c", sans-serif;
      background-color: #f9fff9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #e6ffe6;
      border-bottom: 3px solid #99cc66;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #339933;
      font-size: 1.8em;
    }
    section {
      max-width: 800px;
      margin: 20px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
    }
    h2 {
      color: #006600;
      border-left: 6px solid #99cc66;
      padding-left: 10px;
    }
    .bet-type {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .bet-type img {
      width: 60px;
      margin-right: 15px;
    }
    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      color: #666;
    }
    /* スマホ対応（幅600px以下） */
@media (max-width: 600px) {

  body {
    font-size: 16px;
    padding: 0 10px;
  }

  header {
    padding: 15px 10px;
  }

  h1 {
    font-size: 1.4em;
    line-height: 1.4;
  }

  section {
    margin: 15px 0;
    padding: 15px;
  }

  h2 {
    font-size: 1.2em;
  }

  .bet-type {
    flex-direction: column;
    align-items: flex-start;
  }

  .bet-type img {
    width: 48px;
    margin: 0 0 10px 0;
  }

  footer {
    padding: 20px 0;
  }

  footer a {
    font-size: 0.9em;
  }
}

  </style>
</head>
<body>
  <header>
    <h1>はじめての競馬｜馬券の種類を知ろう</h1>
  </header>

  <section>
    <h2>単勝（たんしょう）</h2>
    <div class="bet-type">
      <img src="img/tansho.png" alt="単勝アイコン">
      <p>選んだ馬が1着になると当たり。もっともシンプルな馬券。</p>
    </div>

    <h2>複勝（ふくしょう）</h2>
    <div class="bet-type">
      <img src="img/fukusho.png" alt="複勝アイコン">
      <p>選んだ馬が3着以内に入れば当たり。初心者におすすめ。</p>
    </div>

    <h2>馬連（ばれん）</h2>
    <div class="bet-type">
      <img src="img/baren.png" alt="馬連アイコン">
      <p>選んだ2頭が1着・2着に入れば当たり。順番は関係なし。</p>
    </div>

    <h2>三連複（さんれんぷく）</h2>
    <div class="bet-type">
      <img src="img/sanrenpuku.png" alt="三連複アイコン">
      <p>選んだ3頭が1〜3着に入れば当たり。難しいが高配当。</p>
    </div>
  </section>

  <footer>
    <a href="#top">▲ サイトTOPに戻る</a>
  </footer>
</body>
</html>
